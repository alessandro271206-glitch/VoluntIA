<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voluntia · Comunidad e impacto</title><link rel="stylesheet" href="/css/styles.css"><script defer src="/js/app.js"></script></head><body><header th:replace="~{fragments :: nav}"></header><main><div th:replace="~{fragments :: alerts}"></div><a class="back" th:href="@{/{ruta}(ruta=${ruta})}">← Volver a la comunidad</a><div class="page-heading"><div><span class="eyebrow" th:text="${org ? 'ORGANIZACIÓN' : 'VOLUNTARIO'}"></span><h1 th:text="${cuenta.nombre}"></h1><p th:text="${cuenta.email}"></p></div><a class="button outline" th:href="@{/{ruta}/editar/{id}(ruta=${ruta},id=${cuenta.id})}">Editar perfil ↗</a></div><section class="panel"><dl><dt>Ubicación</dt><dd th:text="${cuenta.ubicacion}"></dd><dt th:text="${org ? 'RUC' : 'Edad'}"></dt><dd th:text="${org ? cuenta.ruc : cuenta.edad}"></dd><dt th:text="${org ? 'Contacto' : 'Habilidades'}"></dt><dd th:text="${org ? cuenta.infoContacto : cuenta.habilidades}"></dd></dl></section><section class="panel" th:if="${org}"><h2>Campañas creadas</h2><p th:if="${#lists.isEmpty(campanias)}">Aún no ha publicado campañas.</p><p th:each="c : ${campanias}"><a th:href="@{/campanias/{id}(id=${c.id})}" th:text="${c.titulo}"></a></p></section><section class="panel" th:if="${!org}"><h2>Historial de participación</h2><p th:if="${#lists.isEmpty(historial)}">Aún no tiene inscripciones.</p><div th:each="i : ${historial}" class="history-row"><a th:href="@{/campanias/{id}(id=${i.campania.id})}" th:text="${i.campania.titulo}"></a><span class="badge" th:text="${i.estado}"></span></div></section></main></body></html>
