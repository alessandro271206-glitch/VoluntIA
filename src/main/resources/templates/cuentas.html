<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voluntia · Comunidad e impacto</title><link rel="stylesheet" href="/css/styles.css"><script defer src="/js/app.js"></script></head><body><header th:replace="~{fragments :: nav}"></header><main><div th:replace="~{fragments :: alerts}"></div><div class="page-heading"><div><span class="eyebrow">NUESTRA COMUNIDAD</span><h1 th:text="${org ? 'Organizaciones aliadas.' : 'Personas que transforman.'}"></h1><p th:text="${org ? 'Gestiona los colectivos que hacen posible el cambio.' : 'Conoce y gestiona a quienes aportan su tiempo y talento.'}"></p></div><a class="button" th:href="@{/{ruta}/nuevo(ruta=${ruta})}" th:text="${org ? '＋ Nueva organización' : '＋ Nuevo voluntario'}"></a></div><label class="search-label">Buscar en la lista<input id="table-search" placeholder="Nombre, correo o ubicación"></label><div class="panel table-wrap"><table><thead><tr><th>Nombre / correo</th><th>Ubicación</th><th th:text="${org ? 'RUC' : 'Edad / habilidades'}"></th><th>Acciones</th></tr></thead><tbody><tr th:each="c : ${cuentas}" data-search-row><td><strong th:text="${c.usuario.nombre}"></strong><small th:text="${c.usuario.email}"></small></td><td th:text="${c.usuario.ubicacion}"></td><td><span th:text="${org ? c.ruc : c.edad + ' años'}"></span><small th:if="${!org}" th:text="${c.habilidades}"></small></td><td><div class="actions"><a th:href="@{/{ruta}/{id}(ruta=${ruta},id=${c.id})}">Perfil ↗</a><a th:href="@{/{ruta}/editar/{id}(ruta=${ruta},id=${c.id})}">Editar</a><form th:action="@{/{ruta}/eliminar/{id}(ruta=${ruta},id=${c.id})}" method="post" data-confirm="Se eliminará esta cuenta. Las inscripciones del voluntario también se eliminarán. ¿Continuar?"><button class="delete">Eliminar</button></form></div></td></tr></tbody></table><p class="empty" th:if="${#lists.isEmpty(cuentas)}">Tu comunidad está por crecer. Añade el primer registro.</p><p id="no-results" hidden>No se encontraron coincidencias.</p></div></main></body></html>
