<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voluntia · Comunidad e impacto</title><link rel="stylesheet" href="/css/styles.css"><script defer src="/js/app.js"></script></head><body><header th:replace="~{fragments :: nav}"></header><main class="form-page"><a class="back" th:href="@{/{ruta}(ruta=${ruta})}">← Volver a la comunidad</a><span class="eyebrow">CADA PERSONA SUMA</span><h1 th:text="${cuenta.id == null ? (org ? 'Una nueva organización.' : 'Un nuevo voluntario.') : 'Actualizar perfil.'}"></h1><form class="panel" th:action="@{/{ruta}/guardar(ruta=${ruta})}" th:object="${cuenta}" method="post"><input type="hidden" th:field="*{id}"><div th:if="${#fields.hasAnyErrors()}" class="alert danger" role="alert"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><div class="form-grid"><label>Nombre<input type="text" th:field="*{nombre}" required maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small></label><label>Correo electrónico<input type="email" th:field="*{email}" required maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small></label><label>Ubicación<input type="text" th:field="*{ubicacion}" required maxlength="255"><small class="field-error" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></small></label><label>Contraseña (al editar, dejar vacía para conservar)<input type="password" th:field="*{contrasena}" autocomplete="new-password" minlength="6" maxlength="72" th:required="${cuenta.id == null}"><small class="field-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></small></label><div th:if="${!org}" class="form-grid full"><label>Edad<input type="number" th:field="*{edad}" required min="16" max="120"><small class="field-error" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}"></small></label><label>Habilidades<input type="text" th:field="*{habilidades}" maxlength="255" placeholder="Ej. trabajo en equipo, jardinería"><small class="field-error" th:if="${#fields.hasErrors('habilidades')}" th:errors="*{habilidades}"></small></label></div><div th:if="${org}" class="form-grid full"><label>RUC<input type="text" th:field="*{ruc}" required pattern="[0-9]{11}" maxlength="11" inputmode="numeric"><small class="field-error" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></small></label><label>Información de contacto<input type="text" th:field="*{infoContacto}" required maxlength="200"><small class="field-error" th:if="${#fields.hasErrors('infoContacto')}" th:errors="*{infoContacto}"></small></label></div></div><div class="form-actions"><button>Guardar perfil ↗</button><a th:href="@{/{ruta}(ruta=${ruta})}">Cancelar</a></div></form></main></body></html>
